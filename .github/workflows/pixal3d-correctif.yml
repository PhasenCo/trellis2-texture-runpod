name: Image Pixal3D — correctif rapide

# Reconstruit seulement les dernières couches au-dessus d'une image Pixal3D déjà publiée
# (quelques minutes au lieu de ~2 h de compilation natten + poids).
on:
  workflow_dispatch:
    inputs:
      base:
        description: Image Pixal3D de départ
        default: ghcr.io/phasenco/trellis2-texture-runpod:pixal3d-sha-3df8df1

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=pixal3d-fix-sha-
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pixal3d-correctif
          build-args: BASE=${{ inputs.base }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
